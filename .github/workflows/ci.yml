name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Python unit tests
        run: python -m unittest discover -s tools/berlin_pipeline/tests -v
      - name: Pack synthetic sample
        run: |
          python tools/berlin_pipeline/cli.py pack \
            --buildings tools/berlin_pipeline/sample/buildings.geojson \
            --roads tools/berlin_pipeline/sample/roads.geojson \
            --trees tools/berlin_pipeline/sample/trees.geojson \
            --out /tmp/berlin-tiles
          cat /tmp/berlin-tiles/manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/berlin-tiles/manifest.json'))
          assert m['version'] == 2
          assert m['quantizationCm'] == 2
          PY
      - name: Cross-language BWT decoder smoke test
        run: dotnet run --project tools/csharp_smoke/BerlinWorld.Data.Smoke.csproj -- /tmp/berlin-tiles/tile_784_11640.bwt.gz
      - name: Enforce lean repository
        run: python tools/validate_package.py

  hackescher-live-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build live 1 km Hackescher Markt data
        run: |
          python tools/berlin_pipeline/build_area.py \
            --area DataSources/hackescher_markt_area.json \
            --out /tmp/hackescher/Tiles \
            --timeout 25 \
            --retries 2
          cat /tmp/hackescher/Tiles/source_manifest.json
          cat /tmp/hackescher/Tiles/manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/hackescher/Tiles/manifest.json'))
          assert m['version'] == 2
          assert len(m['tiles']) == 4
          assert sum(t['buildings'] for t in m['tiles']) > 300
          assert m['totalBytes'] < 2_000_000
          print('Hackescher Markt compact 3D validation OK')
          PY
          du -sh /tmp/hackescher/Tiles
      - name: Upload ready-to-import Hackescher Markt tiles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HackescherMarkt-Unity-Tiles
          path: /tmp/hackescher/Tiles
          if-no-files-found: error
          compression-level: 9
